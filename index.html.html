<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Bell</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  #bellBtn {
    background: #3a6ea5;
    color: white;
    border: none;
    border-radius: 24px;
    width: 90%;
    height: 90%;
    max-width: 480px;
    max-height: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
    cursor: pointer;
    box-shadow: 0 6px 0 #274b73, 0 8px 18px rgba(0,0,0,0.25);
    transition: transform 0.06s ease, box-shadow 0.06s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #bellBtn:active,
  #bellBtn.ringing {
    transform: translateY(6px);
    box-shadow: 0 0 0 #274b73, 0 4px 10px rgba(0,0,0,0.25);
  }

  #bellBtn:focus-visible {
    outline: 4px solid #ffd166;
    outline-offset: 4px;
  }

  #icon {
    font-size: min(18vw, 140px);
    line-height: 1;
    transform-origin: top center;
  }

  #bellBtn.ringing #icon {
    animation: swing 0.5s ease-in-out 4;
  }

  @keyframes swing {
    0%   { transform: rotate(0deg); }
    20%  { transform: rotate(18deg); }
    50%  { transform: rotate(-16deg); }
    80%  { transform: rotate(10deg); }
    100% { transform: rotate(0deg); }
  }

  #label {
    font-size: min(5vw, 34px);
    font-weight: 700;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

  <button id="bellBtn" aria-label="Ring the classroom bell">
    <span id="icon">🔔</span>
    <span id="label">Ring Bell</span>
  </button>

  <script>
    const btn = document.getElementById('bellBtn');
    let audioCtx = null;

    function getContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Synthesize a simple hand-bell / chime tone using layered
    // sine partials with an exponential decay envelope.
    // No external audio file needed, so this page works fully
    // offline and has no dependencies to break.
    function ringBell() {
      const ctx = getContext();
      const now = ctx.currentTime;

      const fundamental = 880; // A5, a bright, clear "ding"
      const partials = [
        { ratio: 1,    gain: 0.9 },
        { ratio: 2.01, gain: 0.5 },
        { ratio: 2.7,  gain: 0.3 },
        { ratio: 4.2,  gain: 0.15 }
      ];

      const master = ctx.createGain();
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(0.6, now + 0.008);
      master.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);
      master.connect(ctx.destination);

      partials.forEach(p => {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(fundamental * p.ratio, now);

        const g = ctx.createGain();
        g.gain.setValueAtTime(p.gain, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 2.2 / p.ratio);

        osc.connect(g);
        g.connect(master);
        osc.start(now);
        osc.stop(now + 2.8);
      });

      // second strike, slightly softer, for a natural double-ring feel
      const master2 = ctx.createGain();
      master2.gain.setValueAtTime(0.0001, now + 0.32);
      master2.gain.exponentialRampToValueAtTime(0.4, now + 0.33);
      master2.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);
      master2.connect(ctx.destination);

      partials.forEach(p => {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(fundamental * p.ratio, now + 0.32);

        const g = ctx.createGain();
        g.gain.setValueAtTime(p.gain * 0.7, now + 0.32);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.32 + 2.0 / p.ratio);

        osc.connect(g);
        g.connect(master2);
        osc.start(now + 0.32);
        osc.stop(now + 3.2);
      });
    }

    function triggerRing() {
      ringBell();
      btn.classList.remove('ringing');
      // restart animation
      void btn.offsetWidth;
      btn.classList.add('ringing');
      setTimeout(() => btn.classList.remove('ringing'), 900);
    }

    btn.addEventListener('click', triggerRing);
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        triggerRing();
      }
    });
  </script>
</body>
</html>
