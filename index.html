<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Bell</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
}

#bellBtn {
  background: transparent;
  color: #3a2a10;
  border: none;
  width: 90%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.3em;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.06s ease;
}

#bellBtn:active,
#bellBtn.ringing {
  transform: translateY(2px);
}

#bellBtn:focus-visible {
  outline: 4px solid #ffd166;
  outline-offset: 4px;
  border-radius: 16px;
}

#icon {
  font-size: min(38vw, 170px);
  line-height: 1;
  display: inline-block;
  transform-origin: 50% 8%;
  filter: drop-shadow(0 8px 10px rgba(0,0,0,0.22));
}

#bellBtn.ringing #icon {
  animation: swing 0.6s ease-in-out 1;
}

@keyframes swing {
  0% { transform: rotate(0deg); }
  20% { transform: rotate(16deg); }
  50% { transform: rotate(-14deg); }
  80% { transform: rotate(8deg); }
  100% { transform: rotate(0deg); }
}

#label {
  font-size: min(5vw, 32px);
  font-weight: 700;
  letter-spacing: 0.02em;
}
</style>
</head>
<body>

<button id="bellBtn" aria-label="Ring the classroom bell">
  <span id="icon">🔔</span>
  <span id="label">Ring Bell</span>
</button>

<script>
const btn = document.getElementById('bellBtn');
let audioCtx = null;

function getContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

// Synthesize a bright "ding" with a long, singing decay like a real
// handbell: a fast attack, inharmonic overtones, and several seconds of
// ring-out (two slightly detuned oscillators per partial create the
// natural shimmering "beat" you hear from a struck bell as it fades).
// No external audio file needed, so this page works fully offline.
function ringBell() {
  const ctx = getContext();
  const now = ctx.currentTime;

  const fundamental = 1600;
  const partials = [
    { ratio: 1.0, gain: 1.0,  decay: 3.4 },
    { ratio: 2.0, gain: 0.55, decay: 2.8 },
    { ratio: 2.4, gain: 0.35, decay: 2.2 },
    { ratio: 3.0, gain: 0.22, decay: 1.7 },
    { ratio: 4.5, gain: 0.12, decay: 1.2 }
  ];

  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, now);
  master.gain.exponentialRampToValueAtTime(0.8, now + 0.004);
  master.connect(ctx.destination);

  partials.forEach(p => {
    // two slightly detuned oscillators per partial create the natural
    // shimmering "beat" of a real struck bell as it rings out
    [-3, 3].forEach(cents => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      const freq = fundamental * p.ratio * Math.pow(2, cents / 1200);
      osc.frequency.setValueAtTime(freq, now);

      const g = ctx.createGain();
      g.gain.setValueAtTime(p.gain * 0.5, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + p.decay);

      osc.connect(g);
      g.connect(master);
      osc.start(now);
      osc.stop(now + p.decay + 0.1);
    });
  });

  master.gain.exponentialRampToValueAtTime(0.0001, now + 3.6);
}

function triggerRing() {
  ringBell();
  btn.classList.remove('ringing');
  // restart animation
  void btn.offsetWidth;
  btn.classList.add('ringing');
  setTimeout(() => btn.classList.remove('ringing'), 700);
}

btn.addEventListener('click', triggerRing);
btn.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    triggerRing();
  }
});
</script>
</body>
</html>
