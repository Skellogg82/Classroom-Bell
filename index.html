<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Bell</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
}

#bellBtn {
  background: transparent;
  color: #3a2a10;
  border: none;
  width: 90%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5em;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.06s ease;
}

#bellBtn:active,
#bellBtn.ringing {
  transform: translateY(3px);
}

#bellBtn:focus-visible {
  outline: 4px solid #ffd166;
  outline-offset: 4px;
  border-radius: 16px;
}

#icon {
  width: min(70vw, 320px);
  height: auto;
  aspect-ratio: 200 / 120;
  display: block;
  transform-origin: 50% 60%;
  filter: drop-shadow(0 8px 10px rgba(0,0,0,0.25));
}

#bellBtn.ringing #icon {
  animation: tap 0.3s ease-in-out 1;
}

@keyframes tap {
  0% { transform: scale(1) translateY(0); }
  35% { transform: scale(0.97, 1.03) translateY(3px); }
  100% { transform: scale(1) translateY(0); }
}

#label {
  font-size: min(5vw, 32px);
  font-weight: 700;
  letter-spacing: 0.02em;
}
</style>
</head>
<body>

<button id="bellBtn" aria-label="Ring the classroom bell">
  <svg id="icon" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="domeGold" x1="15%" y1="0%" x2="90%" y2="100%">
        <stop offset="0%" stop-color="#fff6d6"/>
        <stop offset="30%" stop-color="#f3cf4e"/>
        <stop offset="60%" stop-color="#d3a422"/>
        <stop offset="100%" stop-color="#93700f"/>
      </linearGradient>
      <linearGradient id="baseGold" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#e8c34a"/>
        <stop offset="45%" stop-color="#c79a1f"/>
        <stop offset="100%" stop-color="#8a6a12"/>
      </linearGradient>
      <linearGradient id="knobGold" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fff6d6"/>
        <stop offset="60%" stop-color="#e2b93a"/>
        <stop offset="100%" stop-color="#a5810f"/>
      </linearGradient>
    </defs>

    <!-- shadow under the bell -->
    <ellipse cx="100" cy="104" rx="80" ry="9" fill="rgba(0,0,0,0.18)"/>

    <!-- round base plate -->
    <ellipse cx="100" cy="98" rx="84" ry="14" fill="#6b4e12"/>
    <ellipse cx="100" cy="94" rx="84" ry="14" fill="url(#baseGold)"/>
    <ellipse cx="100" cy="90" rx="68" ry="9" fill="#7a5c14" opacity="0.5"/>

    <!-- squat bell dome (short and wide, like a real front-desk bell) -->
    <path d="M20,80 C20,42 56,18 100,18 C144,18 180,42 180,80 Z"
          fill="url(#domeGold)" stroke="#7a5c14" stroke-width="2"/>

    <!-- collar ring where dome meets base -->
    <ellipse cx="100" cy="80" rx="80" ry="10" fill="url(#baseGold)" stroke="#7a5c14" stroke-width="1.5"/>

    <!-- shine highlight -->
    <path d="M48,68 C46,46 58,26 82,19 C68,35 62,56 66,72 Z"
          fill="#fffdf2" opacity="0.45"/>

    <!-- flat push-button on top, flush with the dome -->
    <ellipse cx="100" cy="19" rx="17" ry="6" fill="url(#knobGold)" stroke="#7a5c14" stroke-width="1.5"/>
    <ellipse cx="100" cy="17" rx="9" ry="2.5" fill="#fffdf2" opacity="0.6"/>
  </svg>
  <span id="label">Ring Bell</span>
</button>

<script>
const btn = document.getElementById('bellBtn');
let audioCtx = null;

function getContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

// Synthesize a bright, short metallic "ding" like a real spring-loaded
// hotel front-desk bell: a fast percussive strike with inharmonic
// overtones (not evenly-spaced multiples like a chime) and a quick decay.
// No external audio file needed, so this page works fully offline.
function ringBell() {
  const ctx = getContext();
  const now = ctx.currentTime;

  const fundamental = 2600; // bright, high "ting"
  // Inharmonic partial ratios approximate a small metal bell/dome strike.
  const partials = [
    { ratio: 1,    gain: 1.0,  decay: 0.55 },
    { ratio: 1.98, gain: 0.5,  decay: 0.4 },
    { ratio: 2.76, gain: 0.32, decay: 0.32 },
    { ratio: 4.07, gain: 0.18, decay: 0.22 },
    { ratio: 5.4,  gain: 0.1,  decay: 0.16 }
  ];

  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, now);
  master.gain.exponentialRampToValueAtTime(0.75, now + 0.003);
  master.connect(ctx.destination);

  partials.forEach(p => {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(fundamental * p.ratio, now);

    const g = ctx.createGain();
    g.gain.setValueAtTime(p.gain, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + p.decay);

    osc.connect(g);
    g.connect(master);
    osc.start(now);
    osc.stop(now + p.decay + 0.05);
  });

  master.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
}

function triggerRing() {
  ringBell();
  btn.classList.remove('ringing');
  // restart animation
  void btn.offsetWidth;
  btn.classList.add('ringing');
  setTimeout(() => btn.classList.remove('ringing'), 400);
}

btn.addEventListener('click', triggerRing);
btn.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    triggerRing();
  }
});
</script>
</body>
</html>
